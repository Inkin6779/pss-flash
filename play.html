<html>
  <head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-container {
            aspect-ratio: 640 / 480;
            height: 100vh;
            max-width: 100vw;
        }
    </style>
    <script>
    window.onbeforeunload = function() {
        return "Are you sure you want to reload?";
    };
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
        contextMenu: "off"
    };
    const params = new URLSearchParams(window.location.search);
    const fileName = params.get("file-name");

    // Ensure the fileName includes the correct path
    const fullPath = fileName ? `../${fileName}` : '';

    // Set the src attribute of the embed element
    window.onload = function() {
        const embedElement = document.getElementById('game-embed');
        embedElement.src = fullPath;
    };
  </script>
  </head>
  <body>
    <div class="game-container">
      <embed id="game-embed" width="100%" height="100%">
    </div>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  </body>
</html>
