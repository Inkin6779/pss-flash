<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Player</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
        }
        .game-container {
            /* Default 4:3 (640 / 480) fallback; overridden dynamically via --aspect */
            --aspect: calc(640 / 480);
            width: min(100vw, calc(100vh * var(--aspect)));
            height: min(100vh, calc(100vw / var(--aspect)));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }
        input[type="file"] {
            background: #222;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg {
            color: #ff5555;
            font-weight: bold;
        }
    </style>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            contextMenu: "off",
            polyfills: false,
            scale: "showAll",
            letterbox: "on",
            autoplay: "on"
        };
    </script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div class="game-container" id="container"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fileName = params.get("file-name");
        const aspectRatio = params.get("ratio");
        const container = document.getElementById("container");

        // Parse and enforce predetermined aspect ratio (supports "560:384", "560/384", or decimal "1.458")
        if (aspectRatio) {
            const cleanRatio = aspectRatio.trim();
            if (/^\d+(\.\d+)?\s*[:/]\s*\d+(\.\d+)?$/.test(cleanRatio)) {
                const [w, h] = cleanRatio.split(/[:/]/).map(Number);
                if (w > 0 && h > 0) {
                    container.style.setProperty("--aspect", `${w} / ${h}`);
                }
            } else if (/^\d+(\.\d+)?$/.test(cleanRatio) && parseFloat(cleanRatio) > 0) {
                container.style.setProperty("--aspect", cleanRatio);
            }
        }

        function enableReloadGuard() {
            window.addEventListener("beforeunload", function (e) {
                e.preventDefault();
                e.returnValue = "Are you sure you want to reload?";
                return "Are you sure you want to reload?";
            });
        }

        function isValidSwf(name) {
            if (!name) return false;
            const cleanName = name.split("?")[0].split("#")[0];
            return cleanName.toLowerCase().endsWith(".swf");
        }

        function startRuffle(swfUrl) {
            container.innerHTML = "<p>Loading game...</p>";
            enableReloadGuard();

            setTimeout(() => {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                container.innerHTML = "";
                container.appendChild(player);
                player.load(swfUrl);
            }, 1000);
        }

        function showUploadPrompt(errorMessage = "") {
            container.innerHTML = `
                <h2>Load Flash Game (.swf)</h2>
                ${errorMessage ? `<p class="error-msg">${errorMessage}</p>` : ""}
                <p>Select a valid <strong>.swf</strong> file from your device:</p>
                <input type="file" id="swf-picker" accept=".swf" />
            `;

            document.getElementById("swf-picker").addEventListener("change", function (event) {
                const file = event.target.files[0];
                if (!file) return;

                if (isValidSwf(file.name)) {
                    const localBlobUrl = URL.createObjectURL(file);
                    startRuffle(localBlobUrl);
                } else {
                    showUploadPrompt("Invalid file type. Please select a .swf file.");
                }
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            if (fileName) {
                if (isValidSwf(fileName)) {
                    startRuffle(fileName);
                } else {
                    showUploadPrompt("Invalid URL parameter: File must be a .swf file.");
                }
            } else {
                showUploadPrompt();
            }
        });
    </script>
</body>
</html>
