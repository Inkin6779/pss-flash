<!DOCTYPE html>
<html>
  <head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-container {
            aspect-ratio: 640 / 480;
            height: 100vh;
            max-width: 100vw;
        }
    </style>
    <script>
        window.onbeforeunload = function() {
            return "Are you sure you want to reload?";
        };
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            contextMenu: "off"
        };
    </script>
  </head>
  <body>
    <div class="game-container" id="container">
        <embed id="game-embed" width="100%" height="100%">
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fileName = params.get("file-name");
        const embed = document.getElementById("game-embed");

        if (fileName) {
            embed.src = fileName;
        } else {
            document.getElementById("container").innerHTML = 
                "<p style='color:white; font-family:sans-serif;'>No file specified.</p>";
        }
    </script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  </body>
</html>
